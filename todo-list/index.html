<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskFlow To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="hero">
<div><p class="eyebrow">JAVASCRIPT LOGIC &amp; STATE MANAGEMENT</p><h1>TaskFlow</h1><p class="subtitle">Plan your work, track progress, and keep your tasks saved automatically.</p></div>
<div class="stats"><div><strong id="totalCount">0</strong><span>Total</span></div><div><strong id="activeCount">0</strong><span>Active</span></div><div><strong id="completedCount">0</strong><span>Done</span></div></div>
</header>
<section class="panel"><h2>Add a task</h2><form id="taskForm"><input id="taskInput" maxlength="120" placeholder="What needs to be done?" required><button>Add Task</button></form></section>
<section class="toolbar"><div id="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="completed">Completed</button></div><button id="clearCompleted" class="text-button">Clear completed</button></section>
<section class="panel"><div id="emptyState" class="empty"><b>✓</b><h2>No tasks yet</h2><p>Add your first task above and start making progress.</p></div><ul id="taskList"></ul></section>
</main>
<script src="script.js"></script>
</body>
</html>
