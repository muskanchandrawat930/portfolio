<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Muskan Chandrawat through an accessible contact form.">
  <meta name="author" content="Muskan Chandrawat">
  <title>Contact | Muskan Chandrawat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html" aria-label="Muskan Chandrawat home">Muskan</a>
      <nav aria-label="Primary navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a aria-current="page" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="page-heading" aria-labelledby="page-title">
      <div class="container">
        <p class="eyebrow">Get in touch</p>
        <h1 id="page-title">Contact me</h1>
        <p>Use the form below to send a message.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="form-title">
      <div class="container narrow">
        <h2 id="form-title">Contact form</h2>
        <form class="contact-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Full name <span aria-hidden="true">*</span></label>
            <input id="name" name="name" type="text" autocomplete="name" required aria-required="true">
          </div>

          <div class="form-group">
            <label for="email">Email address <span aria-hidden="true">*</span></label>
            <input id="email" name="email" type="email" autocomplete="email" required aria-required="true">
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text">
          </div>

          <div class="form-group">
            <label for="message">Message <span aria-hidden="true">*</span></label>
            <textarea id="message" name="message" rows="6" required aria-required="true"></textarea>
          </div>

          <button class="button" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Muskan Chandrawat. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
